version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next-framework:
        patterns: [next, eslint-config-next, '@next/*']
      react:
        patterns: [react, react-dom, '@types/react*']
